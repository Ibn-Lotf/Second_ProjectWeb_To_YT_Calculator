<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Project CalCulator</title>
	<!--<script src="app.js" defer></script>-->
	<script src="app2.js" defer></script>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="calculator">
    	<input type="text" class="screen" readonly>
    	<div class="operations">
    	    <button class="C btnC">C</button>
            <button class="divide operatorColor">/</button>
            <button class="multiply operatorColor">*</button>
            <button class="minus operatorColor">-</button>
            <button class="nine btnNumber">9</button>
            <button class="eight btnNumber">8</button>
            <button class="seven btnNumber">7</button>
            <button class="plus operatorColor">+</button>
            <button class="six btnNumber">6</button>
            <button class="five btnNumber">5</button>
            <button class="four btnNumber">4</button>
            <button class="equals">=</button>
            <button class="three btnNumber">3</button>
            <button class="two btnNumber">2</button>
            <button class="one btnNumber">1</button>
            <button class="zero btnNumber">0</button>
            <button class="point btnNumber">.</button>
    	</div>
	</div>
</body>
</html>
